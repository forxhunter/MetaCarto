name: tests

on:
  push:
    branches: [main]
  pull_request:

jobs:
  pytest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install
        run: pip install cobra networkx numpy pytest
      # data/ is gitignored, so the BiGG model the fixtures need is fetched
      # here rather than committed. Without it the suite skips rather than
      # fails, which would make a green run meaningless -- so the fetch is a
      # required step, not best-effort.
      - name: Fetch the e_coli_core fixture
        run: |
          mkdir -p data/bigg/models
          # -L because bigg.ucsd.edu 301s http to https, and curl without it
          # writes the redirect's HTML body to the file. `-f` does not catch
          # that: a 301 is not a failure status, so the download "succeeded"
          # and thirteen tests failed later trying to parse
          # "<html><title>301 Moved Permanently</title>" as a COBRA model.
          curl -sSfL -o data/bigg/models/e_coli_core.json \
            https://bigg.ucsd.edu/static/models/e_coli_core.json
          # Fail here rather than in the fixtures if it is ever not JSON again.
          python -c "import json; m = json.load(open('data/bigg/models/e_coli_core.json')); \
            assert len(m['reactions']) > 90, m.keys(); \
            print('fixture ok:', len(m['reactions']), 'reactions')"
      - name: Test
        run: python -m pytest tests/ -q

      # `scripts/make_tables.py --check` belongs here by rights -- it catches a
      # manuscript table that no longer matches the run it came from -- but the
      # manuscript tree is gitignored, so on a fresh clone there is nothing to
      # compare against and the step would report every table stale. It stays a
      # local pre-submission check.
